<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Movie Shop</title>
    <link rel="stylesheet" href="/CSS/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="h-24 flex items-center bg-slate-200">
        <div class="container mx-auto flex items-center justify-between">
            <span class="text-3xl text-gray-500"><i class="fa-solid fa-film"></i> Movie Shop</span>
            <nav>
                <ul class="flex items-center gap-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (0)</a></li>
                    <div class="auth flex items-center gap-3">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a>
                    </div>
                    <div class="guest flex items-center gap-3">
                        <a href="register.html">Register</a>
                        <a href="login.html">Login</a>
                    </div>
                    
                </ul>
            </nav>
        </div>
    </header>

    <section class="py-20">
        <div class="container mx-auto justify-between items-center">
            <h1 class="text-3xl">Cart</h1>
        <div id="cart" class="my-12 "></div>
        <form  id="checkout">
            <textarea name="adress" autocomplete placeholder="Enter your delivery adress"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"></textarea>
            <button class="border border-gray-500 rounded-md px-4 py-2  text-white bg-gray-600 hover:bg-gray-500" >Check out</button>

        </form>
        </div>
    </section>

    <footer class="bg-slate-200">
        <div class="container mx-auto h-16 flex justify-between items-center">
                <p> Copyrights &copy; Movie Shop , 2024</p>
                <p>Developer PP Team</p>
        </div>
    </footer>
    <script src="./js/dynamicListener.min.js"></script>
    <script type="module">
        import {authlinks , renderCart} from "./Modules/Apps.js"
        const isloggedin = localStorage.getItem('isloggedin') ?? false 
        let cart = localStorage.getItem('cart') ?? []
        const cart_div = document.getElementById('cart')

            // update navigation links
            authlinks(isloggedin)





            // Display cart item (if any)
                cart_div.innerHTML = renderCart(cart)
                
    
                // dec button
                addDynamicEventListener(document.body, 'click', '#dec', e =>  {
                    const id = e.target.getAttribute('item')
                    let cart = JSON.parse(cart)
                    
                });

                // inc button
                addDynamicEventListener(document.body, 'click', '#inc', e =>  {
                    const id = e.target.getAttribute('item')
                    let cart = JSON.parse(cart)
                    
                });

                // delete button 
                addDynamicEventListener(document.body, 'click', '#delete', (e) => {
                const id = e.target.getAttribute('item');
                let cart = JSON.parse(cart)
                cart.splice(id, 1); // Remove the item at index `id`
                localStorage.setItem('cart', JSON.stringify(cart)); // Update localStorage
                window.location.href = 'http://127.0.0.1:5500/cart.html'; // Refresh the page
});
    </script>
</body>
</html>
