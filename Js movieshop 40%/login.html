<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movie Shop</title>
    <link rel="stylesheet" href="/CSS/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="h-24 flex items-center bg-slate-200">
        <div class="container mx-auto flex items-center justify-between">
            <span class="text-3xl text-gray-500"><i class="fa-solid fa-film"></i> Movie Shop</span>
            <nav>
                <ul class="flex items-center gap-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (0)</a></li>
                    <div class="auth flex items-center gap-3">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a>
                    </div>
                    <div class="guest flex items-center gap-3">
                        <a href="register.html">Register</a>
                        <a href="login.html">Login</a>
                    </div>
                    
                </ul>
            </nav>
        </div>
    </header>


    <section class="py-20">
        <div id="movie" class="container mx-auto flex justify-center items-start">
        <div class="w-2/3 ">
            <h2 class="text-3xl mb-6">Login</h2>
            <form id="login">
                
                <input type="email" name="email"  autocomplete placeholder="Enter Email adress"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"/>
                <input type="password" name="password" autocomplete placeholder="Enter password"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"/>
            
                <button class="border border-gray-500 rounded-md px-4 py-2  text-white bg-gray-600 hover:bg-gray-500" >Register</button>


            </form>
        </div>
        </div>
    </section>

    <footer class="bg-slate-200">
        <div class="container mx-auto h-16 flex justify-between items-center">
                <p> Copyrights &copy; Movie Shop , 2024</p>
                <p>Developer PP Team</p>
        </div>
    </footer>

    <script type="module">
        import {authlinks} from "./Modules/Apps.js"

            const form = document.getElementById('login')
            const isloggedin = localStorage.getItem('isloggedin') ?? false 

            if (isloggedin) {
            window.location.href = 'http://127.0.0.1:5500/dashboard.html'
        }

            // update navigation links
            authlinks(isloggedin)

        form.addEventListener('submit' , e => {
            e.preventDefault()
            const data = e.target.elements
            const users = localStorage.getItem('users') !== null ? JSON.parse(localStorage.getItem('users')) : []

        
        const email = data['email'].value
        const password = data['password'].value
        
        
            if(users.length > 0 ) {
                const userExist = users.filter(user => (user.email === email && user.password === password))

                if (userExist.length) {
                        localStorage.setItem('isloggedin' , true) 
                        window.location.href = 'http://127.0.0.1:5500/dashboard.html'
                } else {
                    alert('Invalid password')
                }
            } else {
                alert('Please create your account!!!')
            }
        })
    </script>
</body>
</html>
