<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Movie Shop</title>
    <link rel="stylesheet" href="/CSS/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="h-24 flex items-center bg-slate-200">
        <div class="container mx-auto flex items-center justify-between">
            <span class="text-3xl text-gray-500"><i class="fa-solid fa-film"></i> Movie Shop</span>
            <nav>
                <ul class="flex items-center gap-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (0)</a></li>
                    <div class="auth flex items-center gap-3">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a>
                    </div>
                    <div class="guest flex items-center gap-3">
                        <a href="register.html">Register</a>
                        <a href="login.html">Login</a>
                    </div>
                    
                </ul>
            </nav>
        </div>
    </header>


    <section class="py-20">
        <div id="movie" class="container mx-auto flex gap-20 items-center">
            
        </div>
    </section>

    <footer class="bg-slate-200">
        <div class="container mx-auto h-16 flex justify-between items-center">
                <p> Copyrights &copy; Movie Shop , 2024</p>
                <p>Developer PP Team</p>
        </div>
    </footer>
    <script src="./js/dynamicListener.min.js"></script>
    <script type="module">
        import {authlinks} from "./Modules/Apps.js"
        const isloggedin = localStorage.getItem('isloggedin') ?? false 
        let cart = localStorage.getItem('cart') ?? []
        const movie_div = document.getElementById('movie')

            // update navigation links
            authlinks(isloggedin)

        // Movie id from query string
        
        const params = new URLSearchParams(window.location.href.split('?')[1]);
        const movie_id = params.get('id')

        let qty = 1 

        addDynamicEventListener(document.body, 'change', '#qty', e =>  {
                qty = parseInt (e.target.value)
        });


            addDynamicEventListener(document.body, 'click', '#add-to-cart-btn', e =>  {
                fetch (`https://api.themoviedb.org/3/movie/${movie_id}?api_key=3e52e2f5350ae60de5e2fc58e818d2a0`)
                .then (resp => resp.json() )
                .then (movie => {
                cart = JSON.parse(cart)
                
                if (cart.length > 0) {
                    // check 
                    const movie_exist = cart.filter(item => item.id == movie.id)
                    console.log(movie_exist)
                    if (movie_exist == 1 ) {
                            
                            localStorage.setItem('cart' , JSON.stringify([...cart.filter(item => item.id != movie.id) ,   {...movie, qty:movie_exist[0].qty + qty}]))
                    } else {
                        localStorage.setItem('cart' , JSON.stringify([...cart ,   {...movie, qty}]))
                    }
                }else {
                    localStorage.setItem('cart' , JSON.stringify([{...movie , qty}]))
                }
                alert(`${movie.original_title} was added to card`)
            })
        });


            // latest (8) movies 
                fetch (`https://api.themoviedb.org/3/movie/${movie_id}?api_key=3e52e2f5350ae60de5e2fc58e818d2a0`)
                .then (resp => resp.json() )
                .then (movie => {
                    movie_div.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.backdrop_path}" />
                    <div> 
                        <h1 class="text-3xl">${movie.title}</h1>
                        <p class="mt-12">${movie.overview}</p>
                        <table class="mt-12">
                            <tr>
                                <td class="border border-gray-300 px-6 py-2">Relase data</td>
                                <td class="border border-gray-300 px-6 py-2">${movie.release_date}</td>
                                
                            </tr>
                            <tr>
                                <td class="border border-gray-300 px-6 py-2">Popularity</td>
                                <td class="border border-gray-300 px-6 py-2">${movie.popularity}</td>
                                
                            </tr>
                            <tr>
                                <td class="border border-gray-300 px-6 py-2">Votes</td>
                                <td class="border border-gray-300 px-6 py-2">${movie.vote_count}</td>
                                
                            </tr>
                        </table>
                        ${(isloggedin) ? `<div class="mt-12"> 
                            <input type="number" id="qty" value="1" max="100" min="1"  class="border border-gray-500 rounded-md px-2 py-1"/>
                            <button id="add-to-cart-btn" class="border border-gray-500 rounded-md px-2 py-1 ml-2  text-white bg-gray-600 hover:bg-gray-500" >Add to cart </button>
                        </div>`: `<p class="mt-6"> Please <a href="login.html" class="underline">Login</a> first </p>`
                        }
                    </div>
                    ` 
                })
        
    
    </script>
</body>
</html>
