<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Movie Shop</title>
    <link rel="stylesheet" href="/CSS/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="h-24 flex items-center bg-slate-200">
        <div class="container mx-auto flex items-center justify-between">
            <span class="text-3xl text-gray-500"><i class="fa-solid fa-film"></i> Movie Shop</span>
            <nav>
                <ul class="flex items-center gap-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (0)</a></li>
                    <div class="auth flex items-center gap-3">
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a></li>
                    </div>
                    <div class="guest flex items-center gap-3">
                        <li><a href="register.html">Register</a></li>
                        <li><a href="login.html">Login</a></li>
                    </div>
                    
                </ul>
            </nav>
        </div>
    </header>


    <section class="py-20">
        <div id="movie" class="container mx-auto flex justify-center items-start">
        <div class="w-2/3 ">
            <h2 class="text-3xl mb-6">Register</h2>
            <form id="register" method="post">
                <input type="text" name="name" placeholder="Enter fullname"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"/>
                <input type="email" name="email" placeholder="Enter Email adress"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"/>
                <input type="password" name="password1" autocomplete placeholder="Enter password"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"/>
                <input type="password" name="password2" autocomplete placeholder="Confirm password"  class=" w-[400px] border border-gray-500 rounded-md px-6 py-2 mr-3 block mb-6"/>
                <button class="border border-gray-500 rounded-md px-4 py-2  text-white bg-gray-600 hover:bg-gray-500" >Register</button>


            </form>
        </div>
        </div>
    </section>

    <footer class="bg-slate-200">
        <div class="container mx-auto h-16 flex justify-between items-center">
                <p> Copyrights &copy; Movie Shop , 2024</p>
                <p>Developer PP Team</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('register')
        const isloggedin = localStorage.getItem('isloggedin') ?? false 

        if (isloggedin) {
            window.location.href = 'http://127.0.0.1:5500/dashboard.html'
        } 
        form.addEventListener('submit' , e => {
            e.preventDefault()
            const data = e.target.elements
            const users = localStorage.getItem('users') !== null ? JSON.parse(localStorage.getItem('users')) : []

        const fullname = data['name'].value
        const email = data['email'].value
        const password1 = data['password1'].value
        const password2 = data['password2'].value
        if (password1 !== password2) {
        alert('Password must match!')
        } else {
            if(users.length > 0 ) {
                const userExist = users.filter(user => user.email === email)
                if (userExist.length > 0) {
                    alert(`this email is used!`)
                } else {
                    localStorage.setItem('users' , JSON.stringify([...users, {fullname,email,password:password1}]))
                }
            } else {
                localStorage.setItem('users' , JSON.stringify([{fullname,email,password:password1}]))
                
                alert('Your account was created succesfully. ')
                window.location.href = 'http://127.0.0.1:5500/login.html'
        }
            }
        
        })
    </script>
</body>
</html>
